<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credits — KudosCV</title>
  <link rel="icon" href="/assets/kudosLogo.ico">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .credits-wrapper {
      max-width: 600px;
      margin: 48px auto;
      padding: 0 24px;
    }

    .credits-wrapper h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .credits-wrapper p.subtitle {
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      margin-bottom: 32px;
    }

    .credit-entry {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid var(--color-border-light);
    }

    .credit-entry:last-child {
      border-bottom: none;
    }

    .credit-entry .credit-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .credit-entry a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .credit-entry a:hover {
      text-decoration: underline;
    }

    .credit-entry .credit-source {
      font-size: 0.8125rem;
      color: var(--color-text-secondary);
    }

    .back-link {
      display: inline-block;
      margin-top: 32px;
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div id="app" class="credits-wrapper">
    <h1>Credits</h1>
    <p class="subtitle">KudosCV uses the following resources from third-party creators.</p>

    <div class="credit-entry">
      <span class="credit-icon">🌱</span>
      <div>
        <a href="https://www.flaticon.es/iconos-gratis/agricultura-y-jardineria" target="_blank" rel="noopener" title="agricultura y jardinería iconos">
          Agricultura y jardinería iconos
        </a>
        <div class="credit-source">created by <strong>wahya</strong> — Flaticon</div>
      </div>
    </div>

    <div class="credit-entry">
      <span class="credit-icon">🔧</span>
      <div>
        <a href="https://www.flaticon.es/iconos-gratis/construccion-y-herramientas" target="_blank" rel="noopener" title="construcción y herramientas iconos">
          Construcción y herramientas iconos
        </a>
        <div class="credit-source">created by <strong>wahya</strong> — Flaticon</div>
      </div>
    </div>

    <div class="credit-entry">
      <span class="credit-icon">🔧</span>
      <div>
        <a href="https://www.flaticon.es/iconos-gratis/construccion-y-herramientas" target="_blank" rel="noopener" title="construcción y herramientas iconos">
          Construcción y herramientas iconos
        </a>
        <div class="credit-source">created by <strong>wahya</strong> — Flaticon</div>
      </div>
    </div>

    <a href="/" class="back-link">← Back to KudosCV</a>
  </div>
</body>
</html>
